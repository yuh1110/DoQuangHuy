<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Aquarium - Bể Cá Nghệ Thuật Đa Dạng Sinh Thái</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="aquarium-container" id="aquarium">
    <!-- Canvas Đồ họa Chính -->
    <canvas id="aquariumCanvas"></canvas>

    <!-- Thanh Điều Khiển Floating UI Minimalist -->
    <div class="control-panel">
      <div class="panel-group">
        <span class="panel-label">🏞️ Nền:</span>
        <select id="bgSelect">
          <option value="deepOcean">1. Đại Dương Sâu (Deep Ocean)</option>
          <option value="tropicalReef">2. Rạn San Hô Nhiệt Đới</option>
          <option value="midnightGlow">3. Dạ Quang Ban Đêm</option>
          <option value="sunlitShallow">4. Vùng Nước Nông Nắng Ấm</option>
        </select>
      </div>

      <div class="panel-group">
        <span class="panel-label">🔊 Âm thanh:</span>
        <select id="soundSelect">
          <option value="mute">🔇 Tắt Âm Thanh</option>
          <option value="deepWater">1. Bọt Nước Sâu (Ambient Deep)</option>
          <option value="oceanWaves">2. Sóng Biển Rì Rào (Waves)</option>
          <option value="zenMelody">3. Điệu Nhạc Zen Thư Giãn</option>
        </select>
      </div>

      <div class="panel-group">
        <span class="panel-label">🌆 Chế độ:</span>
        <button id="dayNightBtn">🌙 Chuyển Chế Độ Đêm</button>
      </div>

      <button id="feedBtn">🍬 Thả Thức Ăn</button>
    </div>
  </div>

  <!-- Nạp Mã Nguồn Module ES6 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
